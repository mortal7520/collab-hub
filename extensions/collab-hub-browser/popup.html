<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CollabHub Companion</title>
<style>
  body { width: 290px; margin: 0; padding: 12px; font-family: system-ui, sans-serif; background: #0b1020; color: #e2e8f0; font-size: 12px; }
  h3 { margin: 0 0 6px; font-size: 14px; }
  p { margin: 0 0 8px; color: #94a3b8; line-height: 1.45; }
  .card { border: 1px solid rgba(148,163,184,0.25); border-radius: 8px; padding: 9px; background: #12182d; margin-bottom: 9px; }
  button { width: 100%; padding: 7px; border-radius: 7px; border: 0; background: #6366f1; color: #fff; font-weight: 600; cursor: pointer; }
  code { background: #1e293b; padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
  <h3>⚡ CollabHub Chat Companion</h3>
  <div class="card" id="statusBox">Connecting to local <code>127.0.0.1:5290</code>…</div>
  <p>Visible floating pill automatically anchors next to the composer in Claude, ChatGPT, Gemini, Muse, DeepSeek, Grok &amp; Perplexity.</p>
  <button id="btnOpen">Open Full Workbench (5290)</button>
  <script src="popup.js"></script>
</body>
</html>
