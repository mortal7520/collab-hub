# CollabHub v3.0 — Always-On tmux Live Usage & Fleet StatusLine
# Source this in ~/.tmux.conf:
#   source-file /path/to/collab-hub/extensions/terminal-hud/tmux.conf

set -g status-interval 5
set -g status-right-length 110
set -g status-right "#(collab-hub hud --format statusline --width 90 2>/dev/null || echo 'CollabHub offline')"
