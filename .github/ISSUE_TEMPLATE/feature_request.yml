name: Feature / Client Adapter Request
description: Request support for a new AI coding agent, MCP client, or workflow capability
labels: ["enhancement"]
body:
  - type: input
    id: client
    attributes:
      label: Target AI Agent / Client or Capability
      placeholder: "e.g. Zed ACP, JetBrains AI, OpenTelemetry export"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Problem & proposed workflow
    validations:
      required: true
