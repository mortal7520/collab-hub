name: Bug Report
description: Report a reproducible issue in CollabHub v3.0
labels: ["bug"]
body:
  - type: input
    id: env
    attributes:
      label: OS, Node.js version & AI Client(s)
      placeholder: "e.g. macOS 15, Node 22.14, Claude Code + Cursor"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce & output
      placeholder: "Paste sanitized output from `npx collab-hub doctor` or test failure..."
    validations:
      required: true
