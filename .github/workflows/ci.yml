name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run zero-dependency test suite
        run: node --test test/collab-hub.test.mjs
      - name: Verify MCP stdio handshake (51 tools + SEP-1865 MCP App resource)
        run: |
          node --input-type=module -e "
          import { spawn } from 'node:child_process';
          import readline from 'node:readline';
          const c = spawn(process.execPath, ['src/mcp-server.mjs'], { stdio: ['pipe', 'pipe', 'pipe'] });
          const rl = readline.createInterface({ input: c.stdout });
          const out = [];
          rl.on('line', (l) => {
            out.push(JSON.parse(l));
            if (out.length === 4) {
              if (out[1].result.tools.length !== 51) process.exit(1);
              if (!out[2].result.resources.some((r) => r.uri === 'ui://collab-hub/cockpit.html')) process.exit(1);
              if (out[3].result.contents[0].mimeType !== 'text/html;profile=mcp-app') process.exit(1);
              console.log('MCP v2 verified:', out[0].result.serverInfo, out[1].result.tools.length, 'tools,', out[2].result.resources.length, 'MCP App resource(s)');
              c.kill();
              process.exit(0);
            }
          });
          c.stdin.write(JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-06-18', capabilities: {}, clientInfo: { name: 'ci', version: '1' } } }) + '\n');
          c.stdin.write(JSON.stringify({ jsonrpc: '2.0', id: 2, method: 'tools/list', params: {} }) + '\n');
          c.stdin.write(JSON.stringify({ jsonrpc: '2.0', id: 3, method: 'resources/list', params: {} }) + '\n');
          c.stdin.write(JSON.stringify({ jsonrpc: '2.0', id: 4, method: 'resources/read', params: { uri: 'ui://collab-hub/cockpit.html' } }) + '\n');
          setTimeout(() => process.exit(1), 8000);
          "
