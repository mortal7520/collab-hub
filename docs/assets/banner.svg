<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="CollabHub — Zero-Dependency Local-First Multi-Agent Orchestration Workbench">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="50%" stop-color="#0D1528"/>
      <stop offset="100%" stop-color="#0A1222"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="84%" cy="72%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#24324E" stroke-width="1.5"/>

  <!-- Left Brand Mark: Multi-Agent Hub Graph -->
  <g transform="translate(76, 86)">
    <rect x="0" y="0" width="148" height="148" rx="26" fill="#0F1A33" stroke="#26395E" stroke-width="1.5"/>
    <!-- Edges -->
    <line x1="74" y1="74" x2="36" y2="42" stroke="#38BDF8" stroke-width="2.2" stroke-opacity="0.75"/>
    <line x1="74" y1="74" x2="114" y2="42" stroke="#818CF8" stroke-width="2.2" stroke-opacity="0.75"/>
    <line x1="74" y1="74" x2="36" y2="108" stroke="#34D399" stroke-width="2.2" stroke-opacity="0.75"/>
    <line x1="74" y1="74" x2="114" y2="108" stroke="#F59E0B" stroke-width="2.2" stroke-opacity="0.75"/>
    <!-- Outer Agent Nodes -->
    <circle cx="36" cy="42" r="11" fill="#0B1325" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="114" cy="42" r="11" fill="#0B1325" stroke="#818CF8" stroke-width="2.5"/>
    <circle cx="36" cy="108" r="11" fill="#0B1325" stroke="#34D399" stroke-width="2.5"/>
    <circle cx="114" cy="108" r="11" fill="#0B1325" stroke="#F59E0B" stroke-width="2.5"/>
    <!-- Core Hub Node -->
    <circle cx="74" cy="74" r="18" fill="url(#accent)"/>
    <circle cx="74" cy="74" r="7" fill="#070B16"/>
  </g>

  <!-- Center Copy -->
  <g transform="translate(264, 96)">
    <rect x="0" y="-12" width="236" height="26" rx="13" fill="#111F3D" stroke="#2B4370" stroke-width="1"/>
    <circle cx="15" cy="1" r="4" fill="#34D399"/>
    <text x="27" y="5" fill="#93C5FD" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.4">ZERO-DEPENDENCY · LOCAL-FIRST</text>

    <text x="0" y="64" fill="#F8FAFC" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.2">CollabHub</text>
    <text x="278" y="64" fill="url(#accent)" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="22" font-weight="700">v1.1</text>

    <text x="0" y="102" fill="#94A3B8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="18" font-weight="400">
      Multi-Agent Orchestration Workbench · 32 MCP Tools · Kanban + Visual DAG · Git Worktrees
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 124)" font-family="Consolas, ui-monospace, monospace" font-size="12">
      <rect x="0" y="0" width="128" height="28" rx="8" fill="#101B33" stroke="#263B63"/>
      <text x="14" y="18" fill="#38BDF8">0 npm deps</text>

      <rect x="138" y="0" width="152" height="28" rx="8" fill="#101B33" stroke="#263B63"/>
      <text x="152" y="18" fill="#A5B4FC">node:sqlite FTS5</text>

      <rect x="300" y="0" width="166" height="28" rx="8" fill="#101B33" stroke="#263B63"/>
      <text x="314" y="18" fill="#34D399">CLI · HTTP · Desktop</text>

      <rect x="476" y="0" width="176" height="28" rx="8" fill="#101B33" stroke="#263B63"/>
      <text x="490" y="18" fill="#FBBF24">Worktree Test Gate</text>
    </g>
  </g>

  <!-- Right Mini DAG Preview -->
  <g transform="translate(966, 74)" opacity="0.95">
    <rect x="0" y="0" width="178" height="172" rx="14" fill="#0B1325" stroke="#243559" stroke-width="1.2"/>
    <text x="16" y="24" fill="#64748B" font-family="Consolas, monospace" font-size="11">LIVE DAG PIPELINE</text>
    <rect x="16" y="38" width="66" height="28" rx="7" fill="#132242" stroke="#38BDF8"/>
    <text x="27" y="56" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Plan</text>
    <rect x="96" y="38" width="66" height="28" rx="7" fill="#132242" stroke="#818CF8"/>
    <text x="106" y="56" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Critic</text>
    <path d="M 49 66 C 49 86, 89 82, 89 102" fill="none" stroke="#38BDF8" stroke-width="1.6"/>
    <path d="M 129 66 C 129 86, 89 82, 89 102" fill="none" stroke="#818CF8" stroke-width="1.6"/>
    <rect x="36" y="102" width="106" height="30" rx="8" fill="#0E2A25" stroke="#34D399"/>
    <text x="53" y="121" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">✓ Synthesize</text>
    <text x="16" y="156" fill="#475569" font-family="Consolas, monospace" font-size="10">SSE · 24/24 CI PASS</text>
  </g>
</svg>
