<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="CollabHub v3.0 — Always-On Multi-Agent Mission Control, Live Usage HUD & Smart Router">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070910"/>
      <stop offset="55%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#0d0b1a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="76%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="22%" cy="76%" r="38%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13192b"/>
      <stop offset="100%" stop-color="#0c101d"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow1)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <!-- Subtle grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <path d="M0 160 H1280 M0 320 H1280 M0 480 H1280 M320 0 V640 M640 0 V640 M960 0 V640"/>
  </g>

  <!-- Left Hero Copy -->
  <g transform="translate(64,74)">
    <rect x="0" y="0" width="268" height="32" rx="16" fill="#131b33" stroke="#4f46e5" stroke-width="1.2"/>
    <circle cx="18" cy="16" r="5" fill="#34d399"/>
    <text x="32" y="21" fill="#c7d2fe" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600">CollabHub v3.0 · 0 npm deps · MIT</text>

    <text x="0" y="94" fill="#f8fafc" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">One Always-On Brain</text>
    <text x="0" y="152" fill="url(#accentGrad)" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">for Every AI Coding Agent</text>

    <text x="0" y="202" fill="#94a3b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="400">
      <tspan x="0" dy="0">Live cross-agent token &amp; cost ledger, capability-aware routing,</tspan>
      <tspan x="0" dy="28">zero-secret MCP Hub, git worktree merge queue, and sticky native</tspan>
      <tspan x="0" dy="28">plugins across 14 mainstream IDEs, Desktop apps &amp; CLIs.</tspan>
    </text>

    <!-- Stat pills -->
    <g transform="translate(0,296)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600">
      <rect x="0" y="0" width="136" height="38" rx="9" fill="#101729" stroke="#334155"/>
      <text x="14" y="24" fill="#34d399">14 AI Clients</text>

      <rect x="148" y="0" width="136" height="38" rx="9" fill="#101729" stroke="#334155"/>
      <text x="164" y="24" fill="#38bdf8">53 MCP Tools</text>

      <rect x="296" y="0" width="144" height="38" rx="9" fill="#101729" stroke="#334155"/>
      <text x="310" y="24" fill="#a78bfa">3 Profiles /http</text>

      <rect x="452" y="0" width="146" height="38" rx="9" fill="#101729" stroke="#334155"/>
      <text x="466" y="24" fill="#fbbf24">Sticky IDE HUD</text>
    </g>

    <!-- Quickstart terminal bar -->
    <g transform="translate(0,362)">
      <rect x="0" y="0" width="600" height="54" rx="12" fill="#090d18" stroke="#4f46e5" stroke-width="1.3"/>
      <text x="20" y="33" fill="#64748b" font-family="ui-monospace, monospace" font-size="15">$</text>
      <text x="38" y="33" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="15" font-weight="600">npx collab-hub setup --confirm &amp;&amp; npx collab-hub cockpit --dock</text>
    </g>

    <!-- Supported clients strip -->
    <text x="0" y="458" fill="#64748b" font-family="ui-sans-serif, sans-serif" font-size="13.5" font-weight="600">
      Antigravity · Claude Code · Claude Desktop · Codex · Cursor · Windsurf · VS Code · Cline · Roo · OpenCode · Zed · Kiro · Gemini CLI · Ollama
    </text>
  </g>

  <!-- Right Live Constellation + Usage Card -->
  <g transform="translate(720,64)">
    <rect x="0" y="0" width="496" height="512" rx="18" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>

    <!-- Sticky Header inside card -->
    <rect x="16" y="16" width="464" height="52" rx="12" fill="#171f36" stroke="#6366f1" stroke-opacity="0.55"/>
    <circle cx="38" cy="42" r="6" fill="#34d399"/>
    <text x="54" y="47" fill="#f8fafc" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="700">COLLAB HUB · RESIDENT COCKPIT</text>
    <rect x="372" y="27" width="94" height="30" rx="15" fill="#0f2924" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="392" y="47" fill="#34d399" font-family="ui-monospace, monospace" font-size="14" font-weight="700">♥ 98/100</text>

    <!-- Constellation diagram -->
    <g transform="translate(248,195)">
      <circle cx="0" cy="0" r="88" fill="none" stroke="#334155" stroke-dasharray="4 5"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#4f46e5" stroke-opacity="0.45"/>
      <g stroke="#6366f1" stroke-width="1.6" stroke-opacity="0.55">
        <line x1="0" y1="0" x2="-82" y2="-40"/>
        <line x1="0" y1="0" x2="86" y2="-36"/>
        <line x1="0" y1="0" x2="-74" y2="54"/>
        <line x1="0" y1="0" x2="78" y2="52"/>
        <line x1="0" y1="0" x2="0" y2="-88"/>
      </g>
      <circle cx="0" cy="0" r="24" fill="#4f46e5"/>
      <text x="0" y="5" text-anchor="middle" fill="#fff" font-family="ui-sans-serif, sans-serif" font-size="12" font-weight="800">HUB</text>

      <!-- Orbiting Nodes -->
      <circle cx="0" cy="-88" r="14" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/>
      <text x="0" y="-108" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">Claude 168k</text>

      <circle cx="-82" cy="-40" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="-132" y="-36" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">Codex 124k</text>

      <circle cx="86" cy="-36" r="14" fill="#0f172a" stroke="#818cf8" stroke-width="2.5"/>
      <text x="136" y="-32" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">AGY 68k</text>

      <circle cx="-74" cy="54" r="13" fill="#0f172a" stroke="#a78bfa" stroke-width="2.2"/>
      <text x="-126" y="58" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">Cursor 29k</text>

      <circle cx="78" cy="52" r="13" fill="#0f172a" stroke="#22d3ee" stroke-width="2.2"/>
      <text x="134" y="56" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">Windsurf 15k</text>
    </g>

    <!-- Live Usage & Router Strip -->
    <g transform="translate(20,318)">
      <rect x="0" y="0" width="456" height="84" rx="11" fill="#0d1323" stroke="#1e293b"/>
      <text x="16" y="24" fill="#94a3b8" font-family="ui-sans-serif, sans-serif" font-size="12" font-weight="700">REAL-TIME USAGE (METADATA-ONLY, ZERO PROMPTS)</text>
      <text x="16" y="52" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="22" font-weight="800">412.8k tok</text>
      <text x="176" y="52" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="18" font-weight="700">1.4k/min</text>
      <text x="302" y="52" fill="#34d399" font-family="ui-monospace, monospace" font-size="18" font-weight="700">$2.18/day</text>
      <rect x="16" y="65" width="424" height="7" rx="3.5" fill="#1e293b"/>
      <rect x="16" y="65" width="174" height="7" rx="3.5" fill="#6366f1"/>
      <rect x="192" y="65" width="128" height="7" rx="3.5" fill="#38bdf8"/>
      <rect x="322" y="65" width="70" height="7" rx="3.5" fill="#34d399"/>
      <rect x="394" y="65" width="46" height="7" rx="3.5" fill="#a78bfa"/>
    </g>

    <!-- Smart Model Router pill -->
    <g transform="translate(20,414)">
      <rect x="0" y="0" width="456" height="80" rx="11" fill="#0d1323" stroke="#312e81"/>
      <text x="16" y="24" fill="#c7d2fe" font-family="ui-sans-serif, sans-serif" font-size="12" font-weight="700">CAPABILITY &amp; MODEL-STRENGTH SMART ROUTER</text>
      <text x="16" y="47" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12.5">Security Audit → Codex (96) · Copywriting → AGY (96)</text>
      <text x="16" y="67" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12.5">Linux/Docker → DSH (99) · Quick Cost-Opt → Ollama ($0)</text>
    </g>
  </g>
</svg>
